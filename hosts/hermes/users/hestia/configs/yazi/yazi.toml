[mgr]
ratio = [1,2,5]

[plugin]
pre_exit = "yazi -p"

[preview]
max_width = 800
wrap = "yes"

[opener]
qpdfview = [
{ run = 'qpdfview "$@"', desc = "QPDFView" },
]
ristretto = [
{ run = 'ristretto "$@"', desc = "Ristretto" },
]
thunar = [
{ run = 'thunar %S', desc = "View in Thunar" },
]

[open]
prepend_rules = [
{ url = "*.pdf", use = "qpdfview" },
{ url = "*.png", use = "ristretto" },
{ url = "*.jpg", use = "ristretto" },
]
